name: Deploy Hugo site to Pages

on:
  # Rebuild on every push to the default branch.
  push:
    branches: ["main"]
  # Daily rebuild so build-time content (next meeting, talk Past/Today/Upcoming)
  # stays current without a commit. 08:30 UTC ≈ just after midnight Pacific.
  schedule:
    - cron: "30 8 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Least-privilege permissions needed to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.2
      # Injected from the repository secret; never committed. Drives the
      # obscured Discord link. If unset, the build still succeeds and links
      # fall back gracefully.
      DISCORD_INVITE: ${{ secrets.DISCORD_INVITE }}
      # Pacific time so "now" (today / next meeting) flips at local midnight.
      TZ: America/Los_Angeles
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        # baseURL comes from the Pages config so this works both on the upstream
        # custom domain (dc714.net) and on a fork's project page (*.github.io/<repo>).
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Drop custom domain on forks (preview at *.github.io)
        if: github.repository != 'The1ProBro/dc714'
        run: rm -f public/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
