# Canonical meeting schedule — the single source of truth for the calendar,
# the "next meeting" card, and the generated .ics feed.
#
# Rule of thumb: 2nd Wednesday of each month, except January & August.
# This is an explicit list (not auto-generated) so exceptions are easy:
#   - drop a line to cancel a month
#   - change `date` to move a meeting
#   - add `room:` to override the default room for one meeting
#
# Top this list up ~yearly. If it runs dry, the site falls back to
# "Next meeting TBD — check Discord" rather than breaking.
#
# Talks are NOT listed here — they live as pages in content/talks/ and are
# matched to a meeting by date.

